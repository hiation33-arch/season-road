    const toggle = document.getElementById('stripToggle');
    const label  = document.getElementById('trendLabel');
    if (toggle) toggle.style.display = 'flex';
    if (label)  label.style.display = 'none';
    const tabTrend  = document.getElementById('stripTabTrend');
    const tabSeason = document.getElementById('stripTabSeason');
    if (tabTrend)  tabTrend.textContent  = L().trendStripLabel;
    if (tabSeason) tabSeason.textContent = `${SEASON_EMO[currentSeason]} ${L().stripTabSeason}`;
  }
  function showStripLabel(text) {
    updateArrowLabel();
    const toggle = document.getElementById('stripToggle');
    const label  = document.getElementById('trendLabel');
    if (toggle) toggle.style.display = 'none';
    if (label) { label.style.display = ''; label.textContent = text; }
  }

  // ── 트렌드/추천 토글 전환: 목록만 교체, 펼침 상태는 유지 ──
  function setStripMode(mode) {
    if (_stripMode === mode) return;
    _stripMode = mode;
    const tabTrend  = document.getElementById('stripTabTrend');
    const tabSeason = document.getElementById('stripTabSeason');
    if (tabTrend)  { tabTrend.classList.toggle('is-active', mode === 'trend'); tabTrend.setAttribute('aria-selected', String(mode === 'trend')); }
    if (tabSeason) { tabSeason.classList.toggle('is-active', mode === 'season'); tabSeason.setAttribute('aria-selected', String(mode === 'season')); }
    renderStripBody(currentSeason);
    recalcExpandedHeight();
  }

  // ── 트렌드 TOP5 후보 선정 (축제 우선 → 부족하면 일반 관광지로 채움) ──
  function pickTrendCandidates(season) {
    const apiPlaces = _seasonCache[season];
    if (!apiPlaces || !apiPlaces.length) return null;
    const festivals = apiPlaces.filter(p => p.isFestival);
    const spots     = apiPlaces.filter(p => !p.isFestival);
    const candidates = [...festivals, ...spots].slice(0, 5);
    return candidates.length ? candidates : null;
  }

  // ── 계절 추천 TOP5 선정 ──
  // _seasonTop5Cache[season]에 재채점 결과가 채워져 있으면(성공 시 비어있지 않은 배열) 그 결과를 쓰고,
  // 아직 시도 전이거나 재채점이 빈 배열로 끝난 경우(예: 계절 부적합 카테고리로 후보가 전부 걸러짐)엔
  // 기존 방식(API 반환 순서 상위 5개)으로 조용히 폴백한다.
  function pickSeasonTop5(season) {
    const ranked = _seasonTop5Cache[season];
    if (ranked && ranked.length) return ranked;
    const apiPlaces = _seasonCache[season];
    const curPlaces = apiPlaces || PLACES.filter(p => p.seasons.includes(season));
    return curPlaces.slice(0, 5);
  }

  // 재채점된 추천 TOP5가 아직 실측 조회 중인지 — true인 동안엔 폴백 목록 대신 로딩 상태를 보여준다.
  // season in _seasonTop5Cache로 "시도 완료"를 판정한다(값이 빈 배열이어도 완료로 취급) — 캐시 존재
  // 여부만으로 판정하면(과거 버전) 재채점이 빈 배열로 끝났을 때 캐시가 영영 채워지지 않아 로딩 상태에
  // 무기한 갇히고 위 폴백에도 영영 도달하지 못하는 결함이 있었다(실측 확인, 콘솔 에러 없이 재현).
  // API 자체가 없거나(더미 fallback) 이미 시도가 끝났다면 false(더 이상 기다릴 게 없음).
  function seasonTop5Loading(season) {
    return USE_REAL_API && !(season in _seasonTop5Cache) && !!(_seasonCache[season] && _seasonCache[season].length);
  }

  // ── (단계 3) 추천 TOP5 재채점: 지역 수요 강도(도 단위, 보조 신호) + 연관 관광지 연계 중심성(시군구 단위, 주 신호) ──
  // AreaTarDemDsService는 signguCd를 생략하면 도 단위 집계값(signguCd="0")을 한 번에 주므로 계절당 3회 수준으로 끝난다.
  // TarRlteTarService1은 signguCd가 필수라(NO_MANDATORY_REQUEST_PARAMETERS_ERROR1) 시군구 단위 호출을 피할 수 없다.
  // → 도 단위 수요는 같은 도 안의 후보를 구분 못 하는 3단계 해상도이므로 순위의 주 신호는 연계 중심성에 둔다.
  // baseYm을 전 계절 공통 단일 상수로 쓰면 수요·연계 신호에 계절성이 전혀 반영되지 않아, 지역코드를
  // 공유하는 계절 쌍(예: 여름·겨울)은 점수까지 동일해져 겹침이 재발한다(실측 확인). 계절별로 실제
  // 그 계절에 해당하는 달의 데이터를 쓰도록 분리한다.
  // 실측 확인된 가용 범위: 202508~202606 (그 이후는 totalCount:0, 미발행). 2026년에 아직 도래하지
  // 않은 계절(가을 9~11월, 겨울 12월)은 2025년 같은 달로 대체하고, 이미 지난 계절(봄 3~5월,
  // 여름 중 6월)은 2026년 값을 쓴다.
  const SEASON_DEMAND_YM = { // 수요 강도: 계절 내 3개월 평균으로 단일 월 노이즈를 완화
    spring: ['202603', '202604', '202605'],
    summer: ['202606', '202507', '202508'], // 2026-07·08 미발행 → 2025년 값
    autumn: ['202509', '202510', '202511'], // 2026년 가을 도래 전 → 2025년 값
    winter: ['202512', '202601', '202602'],
  };
  const SEASON_RLTE_YM = { // 연관 관광지: 시군구 단위 호출이라 3배로 늘리면 호출량이 커짐 — 계절당 대표 1개월만
    spring: '202604', summer: '202507', autumn: '202510', winter: '202601',
  };
  const RLTE_CONCURRENCY = 6;    // 시군구별 연관 관광지 호출 동시성 제한 (계절당 26~41개 시군구를 한 번에 쏘지 않음)
  const DEMAND_WEIGHT = 0.3;     // 도 단위 수요 강도는 보조 신호 — 연계 중심성(가중치 1.0) 대비 낮게

  // 계절 적합도: 수요 강도·연계 중심성은 둘 다 "이 관광지가 계절에 맞는 종류인지"는 전혀 모른다
  // (시군구 단위 수요는 강원 안의 스키장과 해수욕장을 구분 못 하고, 연계 중심성도 계절 무관) — 그래서
  // 겨울 추천 상위에 해수욕장(어달해변)이 오르는 결함이 재현됐다. areaBasedList2 응답의 cat3(소분류)를
  // 실측으로 확인해 만든 계절-카테고리 매핑을 점수에 반영한다(실측: 강원·충남 areaBasedList2, 2026-08).
  //   A01011200 해수욕장/해변 · A01010900 계곡 · A01010100 국립공원 · A01010400 산/봉우리 · A02020300 온천
  // 스키장은 이 방식으로 구분 불가 — contentTypeId=12(관광지) 응답에서는 "휴양관광지"(A0202)로만 잡혀
  // 여름 콘도 리조트와 구분되지 않는다(실측: 실제 스키장 전용 코드 A03021200은 contentTypeId=28 레포츠
  // 쪽에만 있고, loadSeasonData()는 12만 조회함). 그래서 "여름 상위에 스키장 없음"은 이 코드만으로는
  // 보장하지 못한다 — 검증 시 별도로 확인 필요.
  const SEASON_CAT_MISMATCH = { // 확실히 계절에 안 맞는 소분류는 후보 풀에서 아예 제외(하드 필터)
    spring: new Set(['A01011200', 'A01010900']), // 봄에 해수욕장·계곡 배제 (여름 명소)
    winter: new Set(['A01011200', 'A01010900']), // 겨울에 해수욕장·계곡은 배제
  };
  const SEASON_CAT_BONUS = { // 계절에 맞는 소분류는 점수에 가산(정규화된 demand·centrality보다 크게 — 확실한 신호이므로)
    // TourAPI cat3에 봄꽃 전용 분류가 없어 가산 효과는 제한적 — 봄꽃 명소는 주로 축제(isFestival)로 유입되므로 기존 축제 우선 로직이 함께 작동함을 전제로 함.
    spring: { 'A01010600': 1, 'A02010800': 0.5 }, // 자연휴양림(수목), 사찰(봄 산책)
    summer: { 'A01011200': 1, 'A01010900': 1 },   // 해수욕장, 계곡
    autumn: { 'A01010100': 1, 'A01010400': 1 },   // 국립공원, 산
    winter: { 'A02020300': 1 },                   // 온천
  };
  const SEASON_FIT_WEIGHT = 1.5; // demand(최대 0.3)·centrality(최대 1.0) 합보다 크게 둬서 명백한 부적합/적합을 확실히 반영
  const _provinceDemandCache = {}; // key: `${areaCd}_${season}` → 도 단위 숙박비중(2102) 계절 평균값 | null(실패)
  const _provincePending     = new Set();
  const _districtRlteCache   = {}; // key: `${districtCode}_${season}` → Map(정규화 이름→연계 중심성 카운트) | null(실패)
  const _districtPending     = new Set();
  const _seasonTop5Cache     = {};
  const _seasonTop5Pending   = new Set();

  // 이름 정규화: 공백·괄호·특수문자 제거 후 완전일치로만 비교한다(퍼지 매칭은 오탐으로 점수를 왜곡시킴).
  function _normName(name) {
    return String(name || '').replace(/[\s()（）·,.\-_/]/g, '').toLowerCase();
  }

  // 동시성 제한 병렬 처리: items를 limit개씩 워커로 나눠 fn(item)을 실행
  async function _mapWithConcurrency(items, limit, fn) {
    const queue = [...items];
    const workerCount = Math.min(limit, queue.length);
    const workers = Array.from({ length: workerCount }, async () => {
      while (queue.length) {
        const item = queue.shift();
        await fn(item);
      }
    });
    await Promise.all(workers);
  }

  // 실측(2026-08-20): rlte/demand 호출 중 일부가 응답 없이 90초+ 걸린 사례 확인됨(개별 요청에
  // 타임아웃이 없어 fetch()가 무기한 대기). refreshSeasonTop5는 이 결과를 기다리며 탭을 잠그므로,
  // 타임아웃 없이 하나만 멈춰도 전체 계절 전환이 무기한 멈춘 것처럼 보인다. 8초 후 중단시켜
  // 기존 catch 블록의 "부분 실패 허용" 경로로 넘긴다.
  async function _fetchWithTimeout(url, timeoutMs = 8000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      return await fetch(url, { signal: ctrl.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  // 계절 내 3개월치를 각각 조회해 평균낸다 — 한 달 호출이 실패해도 나머지로 평균 계산(부분 실패 허용).
  async function _fetchProvinceDemand(areaCd, season) {
    const yms = SEASON_DEMAND_YM[season] || [];
    const results = await Promise.all(yms.map(async (ym) => {
      try {
        // signguCd를 생략하면 첫 행에 도 단위 집계(signguCd="0")가 포함된다(실측 확인).
        const qs = new URLSearchParams({
          MobileOS: 'ETC', MobileApp: 'SeasonRoad', _type: 'json',
          baseYm: ym, areaCd, tarSjrnDsIxCd: '2102', numOfRows: 5, pageNo: 1,
        });
        const res = await _fetchWithTimeout(`${API_PROXY_BASE}/demand/areaTarSjrnDsList?${qs}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data  = await res.json();
        const items = data?.response?.body?.items;
        const rows  = items && items.item ? (Array.isArray(items.item) ? items.item : [items.item]) : [];
        const total = rows.find(r => r.signguCd === '0') || rows[0];
        return total ? parseFloat(total.tarSjrnDsIxVal) : null;
      } catch (e) {
        console.warn(`[SeasonRoad] 도 단위 수요 강도 조회 실패(${areaCd}, ${ym}):`, e);
        return null;
      }
    }));
    const valid = results.filter(v => v != null);
    return valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null;
  }

  async function _fetchDistrictRelations(areaCd, signguCd, season) {
    try {
      const qs = new URLSearchParams({
        MobileOS: 'ETC', MobileApp: 'SeasonRoad', _type: 'json',
        baseYm: SEASON_RLTE_YM[season], areaCd, signguCd, numOfRows: 1000, pageNo: 1,
      });
      const res = await _fetchWithTimeout(`${API_PROXY_BASE}/rlte/areaBasedList1?${qs}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data  = await res.json();
      const items = data?.response?.body?.items;
      const rows  = items && items.item ? (Array.isArray(items.item) ? items.item : [items.item]) : [];
      const centrality = new Map();
      const bump = (name) => {
        const key = _normName(name);
        if (!key) return;
        centrality.set(key, (centrality.get(key) || 0) + 1);
      };
      rows.forEach(r => { bump(r.tAtsNm); bump(r.rlteTatsNm); });
      return centrality;
    } catch (e) {
      console.warn(`[SeasonRoad] 연관 관광지 조회 실패(${areaCd}${signguCd}, ${season}):`, e);
      return null;
    }
  }

  // 도 하나(areaCd)의 계절별 수요 강도를 1회만 실측 조회 (계절마다 다른 baseYm이라 캐시 키에 계절 포함)
  async function _loadProvinceDemand(areaCd, season) {
    const key = `${areaCd}_${season}`;
    if (key in _provinceDemandCache) return;
    if (_provincePending.has(key)) return; // 같은 계절 재요청이 이미 조회 중 — 이번 라운드는 건너뜀(점수 0 처리)
    _provincePending.add(key);
    try {
      _provinceDemandCache[key] = await _fetchProvinceDemand(areaCd, season);
    } finally {
      _provincePending.delete(key);
    }
  }

  // 시군구 하나(districtCode)의 계절별 연관 관광지 덤프를 1회만 실측 조회 (캐시 키에 계절 포함)
  async function _loadDistrictRlte(districtCode, season) {
    const key = `${districtCode}_${season}`;
    if (key in _districtRlteCache) return;
    if (_districtPending.has(key)) return; // 같은 계절 재요청이 이미 조회 중 — 이번 라운드는 건너뜀(점수 0 처리)
    _districtPending.add(key);
    try {
      _districtRlteCache[key] = await _fetchDistrictRelations(districtCode.slice(0, 2), districtCode, season);
    } finally {
      _districtPending.delete(key);
    }
  }

  // 지역 다양성 이중 캡: 시군구당 최대 1건 + 도(같은 시군구가 아니어도)당 최대 2건.
  // 시군구 캡만으로는 같은 도 안의 서로 다른 시군구가 상위 5를 나눠 채워버려(실측 확인, 5개 중 3개 중복)
  // 가을·겨울처럼 도가 겹치는 계절 조합에서 여전히 많이 겹친다 — 도 캡을 병행해 2/5 수준으로 낮춘다.
  function _pickDiverseTop5(scored) {
    const DISTRICT_CAP = 1;
    const PROVINCE_CAP = 2;
    const perDistrict = {};
    const perProvince = {};
    const picked = [];
    for (const s of scored) {
      const dc = perDistrict[s.district] || 0;
      const pc = perProvince[s.province] || 0;
      if (dc >= DISTRICT_CAP || pc >= PROVINCE_CAP) continue;
      perDistrict[s.district] = dc + 1;
      perProvince[s.province] = pc + 1;
      picked.push(s);
      if (picked.length === 5) return picked.map(p => p.place);
    }
    for (const s of scored) {
      if (picked.includes(s)) continue;
      picked.push(s);
      if (picked.length === 5) break;
    }
    return picked.map(p => p.place);
  }

  // 정규화(도 단위 수요 강도)×DEMAND_WEIGHT + 정규화(시군구 단위 연계 중심성) + 계절 적합도 가산 점수로
  // 정렬 후 시군구 다양성을 적용해 상위 5 선정. 확실히 부적합한 소분류(SEASON_CAT_MISMATCH)는 채점
  // 전에 후보 풀에서 제외한다. 모든 신호가 0(동점)이면 Array#sort의 안정 정렬 특성으로 원래 API 순서가
  // 유지된다.
  function _scoreAndRankTop5(candidates, season) {
    const mismatch = SEASON_CAT_MISMATCH[season];
    const pool = mismatch ? candidates.filter(p => !p._cat3 || !mismatch.has(p._cat3)) : candidates;

    const demandVals = pool
      .map(p => p._districtCode ? _provinceDemandCache[`${p._districtCode.slice(0, 2)}_${season}`] : null)
      .filter(v => v != null);
    const dMin = demandVals.length ? Math.min(...demandVals) : 0;
    const dMax = demandVals.length ? Math.max(...demandVals) : 0;

    const centVals = pool.map(p => {
      const map = _districtRlteCache[`${p._districtCode}_${season}`];
      return map ? (map.get(_normName(p.name)) || 0) : 0;
    });
    const cMax = Math.max(0, ...centVals);

    const bonusMap = SEASON_CAT_BONUS[season] || {};
    const scored = pool.map((p, i) => {
      const dRaw  = p._districtCode ? _provinceDemandCache[`${p._districtCode.slice(0, 2)}_${season}`] : null;
      const dNorm = (dRaw == null || dMax === dMin) ? 0 : (dRaw - dMin) / (dMax - dMin);
      const cNorm = cMax === 0 ? 0 : centVals[i] / cMax;
      const fit   = (p._cat3 && bonusMap[p._cat3] ? bonusMap[p._cat3] : 0) * SEASON_FIT_WEIGHT;
      return {
        place: p, score: dNorm * DEMAND_WEIGHT + cNorm + fit,
        district: p._districtCode || `_none_${i}`,
        province: p._districtCode ? p._districtCode.slice(0, 2) : `_none_${i}`,
      };
    });
    scored.sort((a, b) => b.score - a.score);
    return _pickDiverseTop5(scored);
  }

  // ── 추천 TOP5 백그라운드 재채점 (지역코드×계절 단위 캐시, 계절당 세션 내 1회) ──
  // 결과가 빈 배열이어도(부적합 카테고리로 후보 전멸 등) _seasonTop5Cache[season]을 반드시 채워
  // "시도 완료"로 표시한다 — 그래야 seasonTop5Loading()이 true로 무기한 남지 않고 pickSeasonTop5()의
  // 폴백(API 반환 순서)에 도달할 수 있다. 진행 중엔 탭을 잠가(aria-disabled) 재채점 도중 탭 이탈로
  // 인한 currentSeason 불일치 자체를 예방한다.
  async function refreshSeasonTop5(season) {
    if (!USE_REAL_API || _seasonTop5Cache[season] || _seasonTop5Pending.has(season)) return;
    const apiPlaces = _seasonCache[season];
    if (!apiPlaces || !apiPlaces.length) return; // 관광지 API 자체가 비어있음 → 기존 순서 폴백 유지
    _seasonTop5Pending.add(season);
    lockTabs();
    try {
      const districtCodes = [...new Set(apiPlaces.map(p => p._districtCode).filter(Boolean))];
      const provinceCodes = [...new Set(districtCodes.map(c => c.slice(0, 2)))];
      await Promise.all([
        Promise.all(provinceCodes.map(ac => _loadProvinceDemand(ac, season))), // 계절당 9회 수준(3개월×도) — 동시성 제한 불필요
        _mapWithConcurrency(districtCodes, RLTE_CONCURRENCY, dc => _loadDistrictRlte(dc, season)),
      ]);
      _seasonTop5Cache[season] = _scoreAndRankTop5(apiPlaces, season) || [];
      if (currentSeason === season && !hallyuMode && !bfMode) {
        renderSeasonStrip(season);
        renderSeasonPanel(null);
      }
    } finally {
      _seasonTop5Pending.delete(season);
      unlockTabs();
    }
  }

  // ── 데이터랩 검색어는 항상 한국어로 보낸다: currentLang이 한국어가 아니면
  //    KTO 한국어 서비스(detailCommon2)로 원어명을 별도 조회한다 ──
  async function getKoreanName(place) {
    if (currentLang === 'ko') return place.name;
    if (place.id in _koNameCache) return _koNameCache[place.id];
    try {
      const qs = new URLSearchParams({
        contentId: place.id, MobileOS: 'ETC', MobileApp: 'SeasonRoad', _type: 'json',
      });
      const res = await fetch(`${KTO_BASE_URLS.ko}/detailCommon2?${qs}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data  = await res.json();
      const items = data?.response?.body?.items?.item;
      const item  = Array.isArray(items) ? items[0] : items;
      _koNameCache[place.id] = item?.title || place.name;
    } catch (e) {
      console.warn(`[SeasonRoad] 한국어 장소명 조회 실패(contentId=${place.id}), 표시명으로 대체:`, e);
      _koNameCache[place.id] = place.name;
    }
    return _koNameCache[place.id];
  }

  // ── 네이버 데이터랩 검색어트렌드로 후보 5개 실제 검색량 순위 매기기 ──
  // 실패 시(네트워크 오류, 응답 이상 등) null이 아닌 후보 원순서(축제 우선)를 그대로 반환해 조용히 대체한다.
  async function loadSeasonTrend(season) {
    const candidates = pickTrendCandidates(season);
    if (!candidates) return null;
    try {
      const koNames = await Promise.all(candidates.map(p => getKoreanName(p)));
      const keywordGroups = candidates.map((p, i) => ({ groupName: String(p.id), keywords: [koNames[i]] }));
      const res = await fetch(`${API_PROXY_BASE}/naver/datalab`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ season, keywordGroups }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data    = await res.json();
      const results = data?.results;
      if (!Array.isArray(results) || !results.length) throw new Error('빈 응답');
      const scoreById = {};
      results.forEach(r => {
        const last = r.data && r.data[r.data.length - 1];
        scoreById[r.title] = last ? last.ratio : 0; // title === groupName === contentId
      });
      return [...candidates].sort((a, b) => (scoreById[String(b.id)] ?? 0) - (scoreById[String(a.id)] ?? 0));
    } catch (e) {
      console.warn(`[SeasonRoad] 데이터랩 트렌드 조회 실패 → 축제 우선 순서로 대체:`, e);
      return candidates;
    }
  }

  // ── 트렌드 순위 백그라운드 갱신 (계절당 세션 내 1회) ──
  async function refreshSeasonTrend(season) {
    if (!USE_REAL_API || _trendCache[season] || _trendPending.has(season)) return;
    _trendPending.add(season);
    try {
      const ranked = await loadSeasonTrend(season);
      if (!ranked) return; // 관광지 API 자체가 비어있음 → TREND_DATA 정적 fallback 유지
      _trendCache[season] = ranked;
      if (currentSeason === season && !hallyuMode && !bfMode) {
        renderSeasonStrip(season);
        renderSeasonPanel(null);
      }
    } finally {
      _trendPending.delete(season);
    }
  }

  // ── 트렌드/추천 칩 공통 렌더 (실제 장소 객체 배열 → .trend-chip 목록) ──
  function renderStripChips(body, places) {
    places.slice(0, 5).forEach((place, i) => {
      const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
      const chip = document.createElement('div'); chip.className = 'trend-chip';
      chip.innerHTML = `<span class="trend-rank rank-${i+1}">${i+1}</span>${name}`;
      chip.tabIndex = 0; chip.setAttribute('role', 'button');
      chip.setAttribute('aria-label', `${i+1}위, ${name}`);
      bindActivatable(chip, () => { flyTo(place.lat, place.lng); openPlace(place); });
      body.appendChild(chip);
    });
  }

  // ── #trendBody 내용만 갱신 (펼침 상태는 건드리지 않음) ──
  function renderStripBody(season) {
    const body = document.getElementById('trendBody');
    if (!body) return;
    body.setAttribute('aria-busy', 'true');
    body.innerHTML = '';
    if (_stripMode === 'season') {
      if (seasonTop5Loading(season)) {
        const loading = document.createElement('div');
        loading.className = 'sheet-detail-loading';
        loading.textContent = L().top5Loading;
        body.appendChild(loading);
      } else {
        renderStripChips(body, pickSeasonTop5(season));
      }
    } else {
      const trendPlaces = _trendCache[season] || pickTrendCandidates(season);
      if (trendPlaces && trendPlaces.length) {
        renderStripChips(body, trendPlaces);
      } else {
        (TREND_DATA[season] || []).forEach((item, i) => {
          const chip = document.createElement('div'); chip.className = 'trend-chip';
          const kw = item.keyword[currentLang] || item.keyword.ko;
          chip.innerHTML = `<span class="trend-rank rank-${i+1}">${i+1}</span>${kw}`;
          chip.tabIndex = 0; chip.setAttribute('role', 'button');
          chip.setAttribute('aria-label', `${i+1}위, ${kw}`);
          bindActivatable(chip, () => {
            const place = PLACES.find(p => p.id === item.placeId);
            if (place) { flyTo(place.lat, place.lng); openPlace(place); }
          });
          body.appendChild(chip);
        });
      }
    }
    body.setAttribute('aria-busy', 'false');
  }

  // ── 모바일 스트립: 계절 진입/변경 (토글 라벨 갱신 + 펼침 초기화 + 목록 렌더) ──
  function renderSeasonStrip(season) {
    if (!document.getElementById('trendBody')) return;
    showStripToggle();
    collapseTrendStrip();
    renderStripBody(season);
  }

  function renderDramaStrip(dramas) {
    const body = document.getElementById('trendBody');
    if (!body) return;
    showStripLabel(L().dramaStripLabel);
    body.innerHTML = '';
    collapseTrendStrip();
    dramas.forEach((d, i) => {
      const chip = document.createElement('div'); chip.className = 'trend-chip drama-chip';
      chip.innerHTML = `<span class="trend-rank rank-${Math.min(i+1,5)}">${i+1}</span>${d.title}`;
      chip.tabIndex = 0; chip.setAttribute('role', 'button');
      chip.setAttribute('aria-label', `${i+1}위, ${d.title}`);
      bindActivatable(chip, () => {
        activeDramaId = d.id; activeSiteId = null;
        renderDramaPins([d]); fitBounds(d.sites);
        renderDramaPanel();
      });
      body.appendChild(chip);
    });
  }

  function renderBFStrip() {
    const bfPlaces = bfPlacesForSeason(currentSeason);
    const body = document.getElementById('trendBody');
    if (!body) return;
    showStripLabel(L().bfStripLabel);
    body.innerHTML = '';
    collapseTrendStrip();
    bfPlaces.forEach(place => {
      const chip = document.createElement('div'); chip.className = 'bf-chip';
      const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
      chip.textContent = name;
      chip.tabIndex = 0; chip.setAttribute('role', 'button');
      chip.setAttribute('aria-label', `${name}, 무장애 여행지`);
      bindActivatable(chip, () => { flyTo(place.lat, place.lng, 5); openBFPlace(place); });
      body.appendChild(chip);
    });
  }

  // ── 무장애 사이드패널 ──
  function renderBFPanel() {
    const panel    = document.getElementById('panelContent');
    const lang     = L();
    const bfPlaces = bfPlacesForSeason(currentSeason);

    const courseCards = BF_COURSES.map(c => {
      const bs = BADGE_STYLE[c.type] || BADGE_STYLE.day;
      const cName = c.nameI18n?.[currentLang] || c.nameI18n?.ko || c.name;
      const cDesc = c.descI18n?.[currentLang] || c.descI18n?.ko || c.desc;
      return `<div class="bf-course-card" data-course-id="${c.id}" tabindex="0" role="button" aria-label="${cName} 코스">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
          <span class="bf-course-title">${cName}</span>
          <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${bs.bg};color:${bs.color};white-space:nowrap">${lang.durationLabel[c.type]}</span>
        </div>
        <div class="bf-course-desc">${cDesc}</div>
      </div>`;
    }).join('');

    const placeItems = bfPlaces.map(place => {
      const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
      const isActive = place.id === activeBFId;
      return `<div class="bf-place-item ${isActive?'active':''}" data-bf-id="${place.id}" tabindex="0" role="button" aria-label="${name}, 무장애 여행지">
        <div class="bf-pin-dot"></div>
        <span class="bf-place-name">${name}</span>
        <span class="bf-place-loc">${(place.location||'').split(' ')[0]}</span>
      </div>`;
    }).join('');

    panel.innerHTML = `
      <div class="panel-section">
        <h2 class="panel-section-title">${lang.bfCoursesTitle}</h2>
        ${courseCards}
      </div>
      <div class="panel-divider"></div>
      <div class="panel-section">
        <h2 class="panel-section-title">${lang.bfPlaceListTitle}</h2>
        <div id="bfPlaceList">${placeItems}</div>
      </div>`;

    panel.querySelectorAll('.bf-course-card').forEach(el => {
      bindActivatable(el, () => {
        const course = BF_COURSES.find(c => c.id === el.dataset.courseId);
        if (!course) return;
        const places = course.placeIds.map(id => BARRIER_FREE_DATA.find(p => p.id === id)).filter(Boolean);
        fitBounds(places);
        renderBFPanel();
      });
    });

    panel.querySelectorAll('#bfPlaceList .bf-place-item').forEach(el => {
      bindActivatable(el, () => {
        const place = bfPlaces.find(p => p.id === el.dataset.bfId);
        if (place) { flyTo(place.lat, place.lng, 5); openBFPlace(place); }
      });
    });
  }

  // ── 무장애 장소 상세 ──
  function openBFPlace(place) {
    _sheetEmpty = false;
    _lastOpened = { kind: 'bf', data: place };
    activeBFId = place.id;
    const lang = L();
    const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
    document.getElementById('sheetPlace').textContent = name;
    announce(`${name} 정보를 표시합니다`);
    const badge = document.getElementById('sheetBadge');
    const courseLabel = lang.courseTypeLabel[place.type] || place.label;
    const durLabel    = lang.durationLabel[place.type]   || place.duration;
    const locLabel    = LOCATION_I18N[place.location]?.[currentLang] || place.location;
    badge.textContent = courseLabel;
    badge.style.background = '#fffbeb';
    badge.style.color = '#92400e';

    // API 로드 장소만 detailCommon2(이미지·개요) 상세조회 대상 (더미 데이터는 apiId가 실제 콘텐츠ID가 아니므로 제외)
    const detailSlot = place._fromApi
      ? `${_sheetImageHtml(place.image, name)}<div class="sheet-detail-loading" id="sheetDetailLoading">${lang.detailLoading}</div>`
      : _sheetImageHtml(place.image, name);

    // accessibility가 null이면(API 장소, 아직 미로드) 로딩 표시 후 detailWithTour2로 lazy 로드
    // API 장소는 detailWithTour2 원본(28종 체계)을, 더미 장소는 기존 boolean 5종 구조를 그대로 렌더.
    const accHtml = place.accessibility
      ? (place._fromApi ? _renderBFFieldGrid(place.accessibility) : _renderAccGrid(place.accessibility))
      : `<div class="sheet-detail-loading" id="bfAccLoading">${lang.detailLoading}</div>`;

    document.getElementById('sheetBody').innerHTML = `
      <div id="sheetDetailSlot">${detailSlot}</div>
      <p class="sheet-desc" id="sheetDescText">${place.descI18n?.[currentLang] || place.desc}</p>
      <div class="tag-row">${(place.tagsI18n?.[currentLang] || place.tags).map(t=>`<span class="tag" style="background:#fffbeb;color:#92400e">${t}</span>`).join('')}</div>
      <div class="info-grid">
        <div class="info-card"><div class="info-label">${lang.fieldCourseType}</div><div class="info-val">${courseLabel}</div></div>
        <div class="info-card"><div class="info-label">${lang.fieldDuration}</div><div class="info-val">${durLabel}</div></div>
        <div class="info-card col-2"><div class="info-label">${lang.fieldLocation}</div><div class="info-val">${locLabel}</div></div>
      </div>
      <div class="i18n-section">
        <div class="i18n-title">${lang.accessibility}</div>
        <div class="acc-grid" id="bfAccGrid">${accHtml}</div>
      </div>`;
    setSheetOpen(true);
    _bindBFFieldToggles(document.getElementById('bfAccGrid')); // 재방문 시 캐시된 accessibility로 즉시 렌더되는 경우 대비
    if (bfMode && !hallyuMode) renderBFPanel();

    if (place._fromApi && place.apiId) {
      // 이미지·개요 (detailCommon2, openPlace와 동일 패턴)
      loadPlaceDetail(place.apiId).then(detail => {
        if (!_lastOpened || _lastOpened.kind !== 'bf' || _lastOpened.data !== place) return; // stale 응답 방지(시트 닫힘 포함)
        const slot = document.getElementById('sheetDetailSlot');
        if (!slot) return;
        const imgUrl   = place.image || detail?.firstimage || '';
        const overview = detail?.overview || '';
        if (!imgUrl && !overview) { slot.innerHTML = ''; return; }
        slot.innerHTML = `
          ${_sheetImageHtml(imgUrl, name)}
          ${overview ? `<p class="sheet-overview" id="sheetOverviewText">${overview}</p>
          <button class="sheet-more-btn" id="sheetMoreBtn">${lang.readMore}</button>` : ''}`;
        const moreBtn = document.getElementById('sheetMoreBtn');
        if (moreBtn) {
          moreBtn.addEventListener('click', () => {
            const p = document.getElementById('sheetOverviewText');
            const expanded = p.classList.toggle('expanded');
            moreBtn.textContent = expanded ? lang.readLess : lang.readMore;
          });
        }
        // 개요가 성공적으로 로드되면 주소 텍스트(desc)는 위치 카드와 중복이므로 제거
        if (overview) {
          const descEl = document.getElementById('sheetDescText');
          if (descEl) descEl.remove();
        }
      });

      // 접근성 상세 (detailWithTour2, lazy — 목록 전체가 아닌 클릭한 장소만 호출)
      loadBFDetail(place.apiId).then(detail => {
        if (!_lastOpened || _lastOpened.kind !== 'bf' || _lastOpened.data !== place) return; // stale 응답 방지(시트 닫힘 포함)
        const grid = document.getElementById('bfAccGrid');
        if (!grid) return;
        place.accessibility = detail; // detailWithTour2 원본 그대로 재사용(28종 체계)
        const html = detail ? _renderBFFieldGrid(detail) : '';
        grid.innerHTML = html || `<div class="sheet-detail-loading">${lang.bfNoAccData}</div>`;
        _bindBFFieldToggles(grid);
      });
    }
  }

  // ── 계절 사이드패널 ──
  function renderSeasonPanel(activePlace) {
    const panel     = document.getElementById('panelContent');
    const lang      = L();
    const apiPlaces = _seasonCache[currentSeason];
    const curPlaces = apiPlaces || PLACES.filter(p => p.seasons.includes(currentSeason));
    const top5Loading = seasonTop5Loading(currentSeason);
    const top5      = top5Loading ? [] : pickSeasonTop5(currentSeason);
    const sEmo      = SEASON_EMO[currentSeason];
    const sName     = lang.seasonNames[currentSeason];

    const trendPlaces = _trendCache[currentSeason] || pickTrendCandidates(currentSeason);
    const trends = trendPlaces
      ? trendPlaces.slice(0, 5).map(p => ({ keyword: p.name, placeId: p.id }))
      : (TREND_DATA[currentSeason] || []);

    const trendRows = trends.map((item, i) => {
      const p = curPlaces.find(q => q.id == item.placeId) || PLACES.find(q => q.id === item.placeId);
      const kw = typeof item.keyword === 'object'
        ? (item.keyword[currentLang] || item.keyword.ko)
        : item.keyword;
      return `<div class="panel-item" data-id="${item.placeId}" tabindex="0" role="button" aria-label="${i+1}위, ${kw}">
        <span class="panel-rank rank-${i+1}">${i+1}</span>
        <span class="panel-item-text">${kw}</span>
        ${p ? `<span class="panel-item-sub">${(p.location||'').split(' ')[0]}</span>` : ''}
      </div>`;
    }).join('');

    const top5Rows = top5Loading ? `<div class="sheet-detail-loading">${lang.top5Loading}</div>` : top5.map((place, i) => {
      const bs   = BADGE_STYLE[place.type] || {};
      const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
      const isActive = activePlace && activePlace.id === place.id;
      return `<div class="panel-item" data-id="${place.id}" tabindex="0" role="button" aria-label="${i+1}위, ${name}" ${isActive?'style="background:var(--gray-100)"':''}>
        <span class="panel-rank rank-${i+1}">${i+1}</span>
        <span class="panel-item-text">${name}</span>
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:${bs.bg};color:${bs.color}">${lang.courseTypeLabel[place.type] || place.label}</span>
      </div>`;
    }).join('');

    const placeCard = activePlace ? (() => {
      const bs   = BADGE_STYLE[activePlace.type] || {};
      const name = activePlace.i18n ? (activePlace.i18n[currentLang] || activePlace.name) : activePlace.name;
      const hpBadge = isHalfPriceRegion(activePlace.location)
        ? `<div class="hp-sheet-badge">${L().halfPrice.badge}</div>` : '';
      return `<div class="panel-divider"></div>
        <div class="panel-place-card">
          ${hpBadge}
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="font-size:17px;font-weight:700">${name}</span>
            <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:${bs.bg};color:${bs.color}">${lang.courseTypeLabel[activePlace.type] || activePlace.label}</span>
          </div>
          <p style="font-size:14px;color:#4b5563;line-height:1.65;margin-bottom:10px">${activePlace.descI18n?.[currentLang] || activePlace.desc}</p>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
            ${(activePlace.tagsI18n?.[currentLang] || activePlace.tags).map(t=>`<span style="font-size:12px;color:#14532d;background:#dcfce7;padding:4px 10px;border-radius:20px">${t}</span>`).join('')}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div style="background:#f3f4f6;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-card)"><div style="font-size:11px;color:var(--gray-400);margin-bottom:3px">${lang.fieldDuration}</div><div style="font-size:14px;font-weight:600">${lang.durationLabel[activePlace.type] || activePlace.duration}</div></div>
            <div style="background:#f3f4f6;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-card)"><div style="font-size:11px;color:var(--gray-400);margin-bottom:3px">${lang.fieldLocation}</div><div style="font-size:14px;font-weight:600">${LOCATION_I18N[activePlace.location]?.[currentLang] || activePlace.location}</div></div>
          </div>
        </div>`;
    })() : '';

    panel.innerHTML = `
      <div class="panel-section">
        <h2 class="panel-section-title">${lang.trendTitle}</h2>
        <div class="panel-list" id="trendList">${trendRows}</div>
      </div>
      <div class="panel-divider"></div>
      <div class="panel-section">
        <h2 class="panel-section-title">${lang.seasonTop5(sEmo, sName)}</h2>
        <div class="panel-list" id="top5List">${top5Rows}</div>
      </div>
      ${placeCard}`;

    panel.querySelectorAll('#trendList .panel-item').forEach(el => {
      bindActivatable(el, () => {
        const id  = el.dataset.id;
        const cur = _seasonCache[currentSeason] || PLACES.filter(p => p.seasons.includes(currentSeason));
        const place = cur.find(p => p.id == id) || PLACES.find(p => p.id === Number(id));
        if (place) { flyTo(place.lat, place.lng); openPlace(place); }
      });
    });
    panel.querySelectorAll('#top5List .panel-item').forEach(el => {
      bindActivatable(el, () => {
        const id  = el.dataset.id;
        const cur = _seasonCache[currentSeason] || PLACES.filter(p => p.seasons.includes(currentSeason));
        const place = cur.find(p => p.id == id) || PLACES.find(p => p.id === Number(id));
        if (place) { flyTo(place.lat, place.lng); openPlace(place); }
      });
    });
  }

  // ── 드라마 사이드패널 ──
  function renderDramaPanel(searchLabel) {
    const panel  = document.getElementById('panelContent');
    const lang   = L();
    const dramas = activeDramaId ? DRAMA_DATA.filter(d => d.id === activeDramaId) : DRAMA_DATA;

    const resetBtn = activeDramaId
      ? `<button class="drama-reset-btn" id="dramaResetBtn">${lang.allDramas}</button>` : '';

    const dramaCards = dramas.map((d, i) => {
      const isActive  = d.id === activeDramaId;
      const rankClass = `rank-${Math.min(d.rank, 5)}`;
      return `<div class="drama-card ${isActive?'active':''}" data-drama-id="${d.id}" tabindex="0" role="button" aria-label="${d.rank}위, ${d.title}">
        <div class="drama-color-dot" style="background:${d.pinColor}"></div>
        <span class="drama-card-rank ${rankClass}">${d.rank}</span>
        <div class="drama-card-info">
          <div class="drama-card-title">${d.title}</div>
          <div class="drama-card-meta">
            <span>${d.genre}</span>
            <span class="drama-ott-badge">${d.ott}</span>
            <span class="drama-site-count">${lang.filmingSiteCount(d.sites.length)}</span>
          </div>
        </div>
      </div>`;
    }).join('');

    let siteList = '';
    if (activeDramaId) {
      const drama = DRAMA_DATA.find(d => d.id === activeDramaId);
      if (drama) {
        const items = drama.sites.map(s => {
          const siteName   = s.i18n ? (s.i18n[currentLang] || s.name) : s.name;
          const isActiveSite = s.id === activeSiteId;
          return `<div class="drama-site-item ${isActiveSite?'active':''}" data-site-id="${s.id}" data-drama-id="${drama.id}" tabindex="0" role="button" aria-label="${siteName}, ${drama.title} 촬영지">
            <div>
              <div class="drama-site-name">${siteName}</div>
              <div class="drama-site-scene">${s.scene}</div>
            </div>
          </div>`;
        }).join('');
        siteList = `<div class="panel-divider"></div>
          <div class="panel-section">
            <h2 class="panel-section-title">${lang.filmingSites}</h2>
            <div id="siteList">${items}</div>
          </div>`;
      }
    }

    const title = searchLabel
      ? `${lang.searchResultTitle} <span style="color:var(--hallyu-500)">${searchLabel}</span>`
      : lang.dramaTop5;

    panel.innerHTML = `
      <div class="panel-section">
        <h2 class="panel-section-title">${title}</h2>
        ${resetBtn}
        <div id="dramaCardList">${dramaCards}</div>
      </div>
      ${siteList}`;

    panel.querySelectorAll('#dramaCardList .drama-card').forEach(el => {
      bindActivatable(el, () => {
        const id    = el.dataset.dramaId;
        const drama = DRAMA_DATA.find(d => d.id === id);
        if (!drama) return;
        if (activeDramaId === id) {
          activeDramaId = null; activeSiteId = null;
          renderDramaPins(DRAMA_DATA); renderDramaPanel(searchLabel);
          map.setLevel(7); map.setCenter(new kakao.maps.LatLng(36.5, 127.8));
        } else {
          activeDramaId = id; activeSiteId = null;
          renderDramaPins([drama]); fitBounds(drama.sites);
          renderDramaPanel(searchLabel);
        }
      });
    });

    const resetBtn2 = panel.querySelector('#dramaResetBtn');
    if (resetBtn2) {
      resetBtn2.addEventListener('click', () => {
        activeDramaId = null; activeSiteId = null;
        const filtered = searchLabel
          ? DRAMA_DATA.filter(d => d.title.includes(searchLabel) || d.titleEn.toLowerCase().includes(searchLabel.toLowerCase()))
          : DRAMA_DATA;
        renderDramaPins(filtered);
        renderDramaPanel(searchLabel);
        map.setLevel(7); map.setCenter(new kakao.maps.LatLng(36.5, 127.8));
      });
    }

    panel.querySelectorAll('#siteList .drama-site-item').forEach(el => {
      bindActivatable(el, () => {
        const siteId  = el.dataset.siteId;
        const dramaId = el.dataset.dramaId;
        const drama   = DRAMA_DATA.find(d => d.id === dramaId);
        const site    = drama && drama.sites.find(s => s.id === siteId);
        if (site && drama) { flyTo(site.lat, site.lng); openDramaSite(site, drama); }
      });
    });
  }

  // ── 장소 상세 (계절) ──
  function _sheetImageHtml(url, name) {
    return url ? `<img class="sheet-image" src="${url}" alt="${name || ''}" loading="lazy" />` : '';
  }

  function openPlace(place) {
    _sheetEmpty = false;
    _lastOpened = { kind: 'place', data: place };
    const lang = L();
    const bs   = BADGE_STYLE[place.type] || {};
    const name = place.i18n ? (place.i18n[currentLang] || place.name) : place.name;
    document.getElementById('sheetPlace').textContent = name;
    announce(`${name} 정보를 표시합니다`);
    const badge = document.getElementById('sheetBadge');
    const courseLabel = lang.courseTypeLabel[place.type] || place.label;
    const durLabel    = lang.durationLabel[place.type]   || place.duration;
    const locLabel    = LOCATION_I18N[place.location]?.[currentLang] || place.location;
    badge.textContent = courseLabel;
    badge.style.background = bs.bg || '#f3f4f6';
    badge.style.color      = bs.color || '#374151';

    const hpBadge = isHalfPriceRegion(place.location)
      ? `<div class="hp-sheet-badge">${lang.halfPrice.badge}</div>` : '';
    const festivalBadge = place.isFestival
      ? `<div class="hp-sheet-badge" style="background:linear-gradient(90deg,#f3e8ff,#faf5ff);border-color:var(--hallyu-500);color:var(--hallyu-900)">${lang.festivalBadge}</div>` : '';

    // API 로드 장소만 detailCommon2 상세조회 대상 (더미 PLACES의 apiId는 실제 콘텐츠ID가 아니므로 제외)
    const detailSlot = place._fromApi
      ? `${_sheetImageHtml(place.image, name)}<div class="sheet-detail-loading" id="sheetDetailLoading">${lang.detailLoading}</div>`
      : _sheetImageHtml(place.image, name);

    document.getElementById('sheetBody').innerHTML = `
      <div id="sheetDetailSlot">${detailSlot}</div>
      ${hpBadge}
      ${festivalBadge}
      <p class="sheet-desc" id="sheetDescText">${place.descI18n?.[currentLang] || place.desc}</p>
      <div class="tag-row">${(place.tagsI18n?.[currentLang] || place.tags).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="info-grid">
        <div class="info-card"><div class="info-label">${lang.fieldCourseType}</div><div class="info-val">${courseLabel}</div></div>
        <div class="info-card"><div class="info-label">${lang.fieldDuration}</div><div class="info-val">${durLabel}</div></div>
        <div class="info-card col-2"><div class="info-label">${lang.fieldLocation}</div><div class="info-val">${locLabel}</div></div>
      </div>
      <div class="stay-section" id="sheetStaySlot">
        <div class="stay-title">🏨 ${lang.nearbyStay}</div>
        <div class="sheet-detail-loading" id="sheetStayLoading">${lang.stayLoading}</div>
      </div>`;
    setSheetOpen(true);
    renderSeasonPanel(place);

    // 인근 숙박 (모든 장소 공통, 좌표 기반)
    loadNearbyStays(place.lat, place.lng).then(stays => {
      if (!_lastOpened || _lastOpened.kind !== 'place' || _lastOpened.data !== place) return; // stale 방지(시트 닫힘 포함)
      const slot = document.getElementById('sheetStaySlot');
      if (!slot) return;
      slot.innerHTML = `<div class="stay-title">🏨 ${lang.nearbyStay}</div>` + _renderStayCards(stays);
    });

    if (place._fromApi && place.apiId) {
      loadPlaceDetail(place.apiId).then(detail => {
        // 상세조회가 오는 동안 사용자가 다른 장소를 열었거나 시트를 닫았으면 반영하지 않음
        if (!_lastOpened || _lastOpened.kind !== 'place' || _lastOpened.data !== place) return;
        const slot = document.getElementById('sheetDetailSlot');
        if (!slot) return;
        const imgUrl   = place.image || detail?.firstimage || '';
        const overview = detail?.overview || '';
        if (!imgUrl && !overview) { slot.innerHTML = ''; return; }
        slot.innerHTML = `
          ${_sheetImageHtml(imgUrl, name)}
          ${overview ? `<p class="sheet-overview" id="sheetOverviewText">${overview}</p>
          <button class="sheet-more-btn" id="sheetMoreBtn">${lang.readMore}</button>` : ''}`;
        const moreBtn = document.getElementById('sheetMoreBtn');
        if (moreBtn) {
          moreBtn.addEventListener('click', () => {
            const p = document.getElementById('sheetOverviewText');
            const expanded = p.classList.toggle('expanded');
            moreBtn.textContent = expanded ? lang.readLess : lang.readMore;
          });
        }
        // 개요가 성공적으로 로드되면 주소 텍스트(desc)는 위치 카드와 중복이므로 제거
        if (overview) {
          const descEl = document.getElementById('sheetDescText');
          if (descEl) descEl.remove();
        }
      });
    }
  }

  // ── 촬영지 상세 (드라마) ──
  function openDramaSite(site, drama) {
    _sheetEmpty = false;
    _lastOpened = { kind: 'drama', data: site, drama };
    activeSiteId = site.id;
    const siteName = site.i18n ? (site.i18n[currentLang] || site.name) : site.name;
    document.getElementById('sheetPlace').textContent = siteName;
    announce(`${siteName} 정보를 표시합니다`);
    const badge = document.getElementById('sheetBadge');
    badge.textContent = drama.title;
    badge.style.background = '#faf5ff';
    badge.style.color = '#6b21a8';
    const lang = L();
    document.getElementById('sheetBody').innerHTML = `
      <p class="sheet-desc">${site.scene}</p>
      <div class="info-grid">
        <div class="info-card"><div class="info-label">${lang.fieldLocation}</div><div class="info-val">${site.location}</div></div>
        <div class="info-card"><div class="info-label">${lang.fieldGenre}</div><div class="info-val">${drama.genre}</div></div>
        <div class="info-card col-2"><div class="info-label">${lang.fieldOtt}</div><div class="info-val">${drama.ott}</div></div>
      </div>
      <div class="i18n-section">
        <div class="i18n-title">${lang.multiLang}</div>
        <div class="i18n-grid">
          <div class="i18n-item"><span class="i18n-lang">한국어</span><span class="i18n-text">${site.i18n.ko}</span></div>
          <div class="i18n-item"><span class="i18n-lang">English</span><span class="i18n-text">${site.i18n.en}</span></div>
          <div class="i18n-item"><span class="i18n-lang">中文</span><span class="i18n-text">${site.i18n.zh}</span></div>
          <div class="i18n-item"><span class="i18n-lang">日本語</span><span class="i18n-text">${site.i18n.ja}</span></div>
        </div>
      </div>`;
    setSheetOpen(true);
    renderDramaPanel();
  }

  // ── 한류 모드 진입/해제 ──
  function enterHallyuMode(dramas, searchLabel) {
    hallyuMode = true;
    document.getElementById('hallyuTab').classList.add('active');
    document.querySelectorAll('.tab[data-s]').forEach(t => {
      if (t.dataset.s !== 'hallyu') t.classList.remove('active');
    });
    document.getElementById('legend').classList.add('hidden');
    clearOverlays();
    // 선택/필터된 드라마의 촬영지만 핀으로 렌더 (드라마별 색·컨텍스트 유지).
    // 과거 _hallyuCache 전체를 추가로 그리던 블록은 드롭다운 필터를 무시하고
    // 전 촬영지를 항상 표시(+선택 드라마 이중 렌더)하는 버그라 제거함.
    addDramaPins(dramas || DRAMA_DATA);
    if (bfMode) addBFPins();
    renderDramaStrip(dramas || DRAMA_DATA);
    renderDramaPanel(searchLabel || null);
    resetSheet();
  }

  async function exitHallyuMode() {
    hallyuMode = false; activeDramaId = null; activeSiteId = null;
    document.getElementById('hallyuTab').classList.remove('active');
    document.getElementById('legend').classList.remove('hidden');
    refreshPins();
    if (bfMode) {
      renderBFStrip();
      renderBFPanel();
    } else {
      renderSeasonStrip(currentSeason);
      renderSeasonPanel(null);
      refreshSeasonTrend(currentSeason);
      // refreshSeasonTop5는 시군구 20~40여 건을 순차 조회하며 lockTabs()로 탭을 잠근다.
      // 여기서 await하지 않으면 호출부의 스피너가 먼저 꺼져 "로딩은 끝났는데 탭만 안 눌리는"
      // 무응답 구간이 수 초간 생긴다(실측: 계절 전환당 최대 ~5.6초, season-switch-performance-diagnosis.md 참고).
      await refreshSeasonTop5(currentSeason);
    }
    resetSheet();
  }

  // ── 언어 전환 ──
  const HTML_LANG_MAP = { ko: 'ko', en: 'en', zh: 'zh-Hans', ja: 'ja' };

  function applyLanguage() {
    const lang = L();
    // 문서 언어 속성 동기화 (스크린리더가 올바른 언어 발음 규칙으로 읽도록)
    document.documentElement.lang = HTML_LANG_MAP[currentLang] || 'ko';
    // 탭 이름
    document.querySelectorAll('.tab[data-s]').forEach(tab => {
      const key = tab.dataset.s;
      if (lang.tabs[key]) tab.textContent = lang.tabs[key];
    });
    // 무장애 버튼 + 힌트
    document.getElementById('bfToggleBtn').textContent = lang.bfToggle;
    document.getElementById('bfToggleHint').textContent = bfMode ? lang.bfHintActive : lang.bfHint;
    // 반값 여행 버튼
    document.getElementById('hpMobileBtn').textContent = lang.hpMobile;
    // 검색 placeholder
    document.getElementById('searchInput').placeholder = lang.searchPlaceholder;
    // 언어 버튼 active 상태
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
    // 핀 범례
    const leg = lang.legend;
    document.getElementById('legendDay').textContent      = leg.day;
    document.getElementById('legendOneNight').textContent = leg.oneNight;
    document.getElementById('legendTwoNight').textContent = leg.twoNight;
    document.getElementById('legendHallyu').textContent   = leg.hallyu;
    document.getElementById('legendBF').textContent       = leg.bf;
    // 시트 초기 안내문구 (장소 미선택 상태)
    if (_sheetEmpty) {
      document.getElementById('sheetPlace').textContent = lang.sheetEmptyTitle;
      document.getElementById('sheetBody').innerHTML = `<p class="sheet-desc">${lang.sheetEmptyDesc}</p>`;
    } else if (_lastOpened && document.getElementById('sheet').classList.contains('open')) {
      // 열려있는 바텀시트를 새 언어로 재렌더
      if (_lastOpened.kind === 'place')       openPlace(_lastOpened.data);
      else if (_lastOpened.kind === 'bf')     openBFPlace(_lastOpened.data);
      else if (_lastOpened.kind === 'drama')  openDramaSite(_lastOpened.data, _lastOpened.drama);
    }
    // 반값 배너
    updateHPBanner();
    // 패널 재렌더
    if (hallyuMode) {
      renderDramaPanel();
      renderDramaStrip(activeDramaId ? DRAMA_DATA.filter(d => d.id === activeDramaId) : DRAMA_DATA);
    } else if (bfMode) {
      renderBFStrip();
      renderBFPanel();
    } else {
      renderSeasonStrip(currentSeason);
      renderSeasonPanel(null);
      refreshSeasonTrend(currentSeason);
      refreshSeasonTop5(currentSeason);
    }
  }

  // ── 언어 버튼 이벤트 (다국어 API 재조회 + KO fallback) ──
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      // 캐시 초기화 → 새 언어 API로 재조회
      Object.keys(_seasonCache).forEach(k => delete _seasonCache[k]);
      Object.keys(_trendCache).forEach(k => delete _trendCache[k]);
      Object.keys(_bfCache).forEach(k => delete _bfCache[k]);
      _bfKeywordCache = null;
      _hallyuCache = null;
      if (USE_REAL_API) {
        const seasonCap = currentSeason.charAt(0).toUpperCase() + currentSeason.slice(1);
        showSpinner(hallyuMode ? L().loadingHallyu : bfMode ? L().loadingBF : L()['loading' + seasonCap]);
        try {
          if (hallyuMode)      { await loadHallyuData(); }
          else if (bfMode)     { await loadBFData(currentSeason); }
          else                 { await loadSeasonData(currentSeason); }
        } catch(e) { console.warn('[SeasonRoad] 언어 전환 API 재조회 실패:', e); }
        finally { hideSpinner(); }
      }
      refreshPins();
      applyLanguage();
    });
  });

  // ── 트렌드/추천 토글 (모바일) ──
  document.getElementById('stripTabTrend').addEventListener('click', () => setStripMode('trend'));
  document.getElementById('stripTabSeason').addEventListener('click', () => setStripMode('season'));
  document.getElementById('stripToggle').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const tabs = [document.getElementById('stripTabTrend'), document.getElementById('stripTabSeason')];
    const idx  = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    const next = e.key === 'ArrowRight' ? (idx + 1) % tabs.length : (idx - 1 + tabs.length) % tabs.length;
    tabs[next].focus();
    setStripMode(tabs[next].id === 'stripTabTrend' ? 'trend' : 'season');
  });

  // ── 스트립 아코디언 펼치기/접기 (모바일) ──
  document.getElementById('trendArrowBtn').addEventListener('click', () => {
    if (window.innerWidth > 768) return;
    const strip = document.getElementById('trendStrip');
    const body  = document.getElementById('trendBody');
    const btn   = document.getElementById('trendArrowBtn');
    if (!strip || !body) return;
    if (strip.classList.contains('expanded')) {
      collapseTrendStrip();
    } else {
      strip.classList.add('expanded');
      const totalH = 44 + body.scrollHeight + 2;
      document.documentElement.style.setProperty('--trend-h', totalH + 'px');
      btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-label', '목록 접기');
      setTimeout(() => { map.relayout(); }, 300);
    }
  });

  // ── 무장애 토글 ──
  document.getElementById('bfToggleBtn').addEventListener('click', async () => {
    bfMode = !bfMode;
    const btn          = document.getElementById('bfToggleBtn');
    const hint         = document.getElementById('bfToggleHint');
    const bfLegendRow  = document.getElementById('bfLegendRow');
    const lang         = L();

    if (bfMode) {
      if (USE_REAL_API && _bfCache[currentSeason] === undefined) {
        showSpinner(L().loadingBF);
        try { await loadBFData(currentSeason); } catch(e) { console.warn('무장애 API 실패, 더미 데이터 사용:', e); }
        finally { hideSpinner(); }
      }
      btn.classList.add('active');
      bfLegendRow.style.display = 'flex';
      hint.textContent = lang.bfHintActive;
      refreshPins();
      if (!hallyuMode) { renderBFStrip(); renderBFPanel(); }
      resetSheet();
    } else {
      btn.classList.remove('active');
      bfLegendRow.style.display = 'none';
      hint.textContent = lang.bfHint;
      activeBFId = null;
      refreshPins();
      if (hallyuMode) {
        renderDramaStrip(activeDramaId ? DRAMA_DATA.filter(d => d.id === activeDramaId) : DRAMA_DATA);
        renderDramaPanel();
      } else {
        renderSeasonStrip(currentSeason);
        renderSeasonPanel(null);
        refreshSeasonTrend(currentSeason);
        refreshSeasonTop5(currentSeason);
      }
      resetSheet();
    }
  });

  // ── 검색 ──
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchBarEl = document.getElementById('searchBar');
  const suggBox     = document.getElementById('dramaSuggestions');

  function renderSuggestions(q) {
    const list = q
      ? DRAMA_DATA.filter(d =>
          d.title.includes(q) ||
          d.titleEn.toLowerCase().includes(q.toLowerCase()))
      : DRAMA_DATA;
    if (!list.length) { suggBox.style.display = 'none'; return; }
    suggBox.innerHTML = list.map(d =>
      `<div class="drama-dropdown-item" data-title="${d.title}">
         <span>🎬 ${d.title}</span>
         <span class="drama-dropdown-meta">${d.genre} · ${d.ott} · 촬영지 ${d.sites.length}곳</span>
       </div>`
    ).join('');
    suggBox.querySelectorAll('.drama-dropdown-item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const title = el.dataset.title;
        searchInput.value = title;
        searchClear.style.display = 'block';
        suggBox.style.display = 'none';
        handleSearch(title);
      });
    });
    suggBox.style.display = 'block';
  }

  searchInput.addEventListener('focus', () => {
    searchBarEl.classList.add('focused');
    renderSuggestions(searchInput.value.trim());
  });
  searchInput.addEventListener('blur', () => {
    searchBarEl.classList.remove('focused');
    setTimeout(() => { suggBox.style.display = 'none'; }, 150);
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.style.display = q ? 'block' : 'none';
    clearTimeout(_searchTimer);
    renderSuggestions(q);
    _searchTimer = setTimeout(() => handleSearch(q), 280);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = ''; searchClear.style.display = 'none';
    activeDramaId = null; activeSiteId = null;
    suggBox.style.display = 'none';
    exitHallyuMode();
  });

  function handleSearch(q) {
    if (!q) { if (hallyuMode) renderDramaPanel(); return; }
    const lower   = q.toLowerCase();
    const matched = DRAMA_DATA.filter(d =>
      d.title.includes(q) ||
      d.titleEn.toLowerCase().includes(lower) ||
      d.sites.some(s => s.name.includes(q) || s.location.includes(q))
    );
    if (matched.length) {
      activeDramaId = null; activeSiteId = null;
      enterHallyuMode(matched, q);
      fitBounds(matched.flatMap(d => d.sites));
    } else {
      enterHallyuMode([], q);
      clearOverlays();
      document.getElementById('panelContent').innerHTML =
        `<div class="empty-state">${L().searchNoResult(q)}</div>`;
      announce(L().searchNoResult(q));
      const _noLabel = document.getElementById('trendLabel');
      const _noBody  = document.getElementById('trendBody');
      if (_noLabel) _noLabel.textContent = L().searchNoResultLabel;
      if (_noBody)  _noBody.innerHTML = '';
      collapseTrendStrip();
    }
  }

  // ── 탭 이벤트 ──
  document.querySelectorAll('.tab[data-s]').forEach(tab => {
    tab.addEventListener('click', async () => {
      if (tab.dataset.s === 'hallyu') {
        searchInput.value = ''; searchClear.style.display = 'none';
        activeDramaId = null; activeSiteId = null;
        if (USE_REAL_API && _hallyuCache === null) {
          showSpinner(L().loadingHallyu);
          try { await loadHallyuData(); } catch(e) { console.warn('한류 API 실패, 더미 데이터 사용:', e); }
          finally { hideSpinner(); }
        }
        enterHallyuMode(DRAMA_DATA, null);
      } else {
        searchInput.value = ''; searchClear.style.display = 'none';
        currentSeason = tab.dataset.s;
        document.querySelectorAll('.tab[data-s]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const needsSeasonLoad = USE_REAL_API && !_seasonCache[currentSeason];
        const needsBFLoad     = bfMode && USE_REAL_API && _bfCache[currentSeason] === undefined;
        // top5 재채점(refreshSeasonTop5)이 아직 안 끝난 계절이면 exitHallyuMode() 안에서 탭이 잠긴다.
        // 그 구간까지 스피너를 계속 띄워야 무응답처럼 보이지 않는다.
        const needsTop5Rescore = USE_REAL_API && !bfMode && !_seasonTop5Cache[currentSeason] && !_seasonTop5Pending.has(currentSeason);
        if (needsSeasonLoad || needsBFLoad || needsTop5Rescore) {
          const seasonCap = currentSeason.charAt(0).toUpperCase() + currentSeason.slice(1);
          showSpinner(needsBFLoad && !needsSeasonLoad ? L().loadingBF : L()['loading' + seasonCap]);
          try {
            await Promise.all([
              needsSeasonLoad ? loadSeasonData(currentSeason).catch(e => console.warn(`${currentSeason} API 실패, 더미 데이터 사용:`, e)) : null,
              needsBFLoad     ? loadBFData(currentSeason).catch(e => console.warn(`${currentSeason} 무장애 API 실패, 더미 데이터 사용:`, e)) : null,
            ]);
            await exitHallyuMode();
          } finally { hideSpinner(); }
        } else {
          exitHallyuMode();
        }
      }
    });
  });

  // ── 범례 클릭(당일/1박/2박 필터) ──
  document.querySelectorAll('.legend-row.legend-filter').forEach(row => {
    bindActivatable(row, () => setTypeFilter(row.dataset.typeFilter));
  });

  // ── 바텀시트 핸들 ──
  bindActivatable(document.getElementById('sheetHandle'), () => {
    setSheetOpen(!document.getElementById('sheet').classList.contains('open'));
  });

  // 지도 클릭 → 바텀시트 닫기
  kakao.maps.event.addListener(map, 'click', () => {
    if (_pinClicked) return;
    setSheetOpen(false);
  });

  // ── 초기 렌더링 (더미 데이터로 즉시 표시) ──
  updateHPBanner();
  renderSeasonPins('spring');
  renderSeasonStrip('spring');
  renderSeasonPanel(null);

  // ── 초기 API 로드 (spring, 백그라운드) ──
  if (USE_REAL_API) {
    showSpinner();
    loadSeasonData('spring')
      .then(() => {
        if (!hallyuMode && currentSeason === 'spring') {
          refreshPins();
          renderSeasonStrip('spring');
          renderSeasonPanel(null);
          refreshSeasonTrend('spring');
          return refreshSeasonTop5('spring'); // 반환해야 아래 .finally(hideSpinner)가 top5 잠금 해제까지 기다린다
        }
      })
      .catch(e => console.warn('초기 API 로드 실패, 더미 데이터 유지:', e))
      .finally(() => hideSpinner());
  }

}); // kakao.maps.load 끝
</script>

</div><!-- /app-wrapper -->
</body>
</html>
